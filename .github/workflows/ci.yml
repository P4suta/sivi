name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      native_tests:
        description: Also test macOS and Windows without running the proof inventory
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.native_tests && '["ubuntu-26.04","macos-26","windows-2025"]' || '["ubuntu-26.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: ${{ matrix.os == 'ubuntu-26.04' && 'rust taplo typos actionlint zizmor aqua:EmbarkStudios/cargo-deny aqua:rustsec/rustsec/cargo-audit aqua:nextest-rs/nextest/cargo-nextest' || 'rust aqua:nextest-rs/nextest/cargo-nextest' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sivi-ci-v1
          cache-bin: false
      - run: cargo xtask ci ${{ matrix.os == 'ubuntu-26.04' && 'check' || 'test' }}

  ci-success:
    name: ci-success
    if: always()
    needs: [check]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust
      - name: Require the fast gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo xtask ci gate ci

  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the fast CI gate
        env:
          CI_RESULT: ${{ needs.ci-success.result }}
        run: test "$CI_RESULT" = success
