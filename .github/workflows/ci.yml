name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      full_proofs:
        description: Verify the full portfolio, including mutation testing
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust taplo typos actionlint zizmor aqua:EmbarkStudios/cargo-deny aqua:rustsec/rustsec/cargo-audit aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sivi-ci-v1
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sivi-ci-v1
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci test

  proofs:
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.full_proofs && 130 || 25 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sivi-proofs-v1
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify the affected contracts in bounded containers
        env:
          PROOF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || format('origin/{0}', github.event.repository.default_branch) }}
          PROOF_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_proofs }}
        run: cargo xtask ci proofs
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-evidence
          path: |
            target/proofs/receipts/
            target/proofs/containers/
            target/proofs/container-build/*.log
            target/proofs/jobs/**/kani/*.json
            target/proofs/jobs/alloy-*/**/*.json
            target/proofs/jobs/alloy-*/**/*.xml
            target/proofs/jobs/quint-*/**/*.json
            target/proofs/jobs/prolog-*/*.json
          if-no-files-found: error
          retention-days: 5

  ci-success:
    name: ci-success
    if: always()
    needs: [check, test, proofs]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust
      - name: Require every gating job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo xtask ci gate ci

  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the complete CI gate
        env:
          CI_RESULT: ${{ needs.ci-success.result }}
        run: test "$CI_RESULT" = success
