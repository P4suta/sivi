# The quiet theme: a white page, black ink, no page numbers, no fields, and nothing drawn that the deck did not write.
schema = 1

[theme]
name = "blank"

[page]
width = "960pt"
height = "540pt"
background = "paper"

[colors]
paper = "#ffffff"
ink = "#111111"
muted = "#6a6a6a"
accent = "#111111"
rule = "#e0e0e0"
code_bg = "#f4f4f4"
highlight = "#ffe98a"

[typography]
min_size = "18pt"
paragraph_gap = "0.6em"
fallback = ["BIZ UDPGothic"]

[text.display]
font = "BIZ UDPGothic"
size = "48pt"
weight = 700
color = "ink"
line_height = 1.2
align = "left"

[text.title]
font = "BIZ UDPGothic"
size = "40pt"
weight = 700
color = "ink"
line_height = 1.2
align = "left"

[text.heading]
font = "BIZ UDPGothic"
size = "28pt"
weight = 700
color = "ink"
line_height = 1.25
align = "left"

[text.subtitle]
font = "BIZ UDPGothic"
size = "24pt"
weight = 400
color = "muted"
line_height = 1.4
align = "left"

[text.body]
font = "BIZ UDPGothic"
size = "24pt"
weight = 400
color = "ink"
line_height = 1.45
align = "left"

[text.quote]
font = "BIZ UDPGothic"
size = "32pt"
weight = 400
color = "ink"
line_height = 1.4
align = "left"

[text.caption]
font = "BIZ UDPGothic"
size = "18pt"
weight = 400
color = "muted"
line_height = 1.3
align = "center"

[text.table]
font = "BIZ UDPGothic"
size = "20pt"
weight = 400
color = "ink"
line_height = 1.3
align = "left"

[text.meta]
font = "BIZ UDPGothic"
size = "18pt"
weight = 400
color = "muted"
line_height = 1.2
align = "left"

[text.hero]
font = "BIZ UDPGothic"
size = "48pt"
weight = 700
color = "paper"
line_height = 1.2
align = "left"

[text.lede]
font = "BIZ UDPGothic"
size = "24pt"
weight = 400
color = "paper"
line_height = 1.4
align = "left"

[text.statement]
font = "BIZ UDPGothic"
size = "56pt"
weight = 700
color = "ink"
line_height = 1.2
align = "center"

[inline]
emphasis = { weight = 700 }
strong = { weight = 700 }
code = { font = "JetBrains Mono", background = "code_bg" }
link = { color = "ink", underline = true }
mark = { marker = { color = "highlight", opacity = 0.6, top = "ascender", bottom = "descender" } }

[lists]
bullets = ["•", "–", "·"]
ordered = "1."
indent = "1.25em"
gap = "0.35em"

[code]
font = "JetBrains Mono"
size = "18pt"
line_height = 1.35
background = "code_bg"
padding = "12pt"
highlight = false
tab_width = 4

[tables]
text = "table"
header_weight = 700
rule = "rule"
padding = "6pt"

[quotes]
bar = "ink"
bar_width = "2pt"
indent = "24pt"

[masters.title.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "150pt", width = "840pt", height = "140pt" }
text = "display"
valign = "bottom"

[masters.title.slots.subtitle]
binds = "subtitle"
region = { x = "60pt", y = "300pt", width = "840pt", height = "60pt" }
text = "subtitle"
valign = "top"

[masters.section.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "200pt", width = "840pt", height = "120pt" }
text = "display"
valign = "middle"

[masters.bullets.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.bullets.slots.body]
binds = "flow"
accepts = ["paragraph", "list", "table"]
region = { x = "60pt", y = "156pt", width = "840pt", height = "324pt" }
text = "body"
max_items = 8
max_depth = 2

[masters.comparison.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.comparison.slots.left]
binds = "section"
section = 1
accepts = ["paragraph", "list", "table"]
region = { x = "60pt", y = "156pt", width = "405pt", height = "324pt" }
text = "body"
max_items = 6
max_depth = 2

[masters.comparison.slots.right]
binds = "section"
section = 2
accepts = ["paragraph", "list", "table"]
region = { x = "495pt", y = "156pt", width = "405pt", height = "324pt" }
text = "body"
max_items = 6
max_depth = 2

[masters.figure.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.figure.slots.figure]
binds = "flow"
accepts = ["image"]
required = true
region = { x = "60pt", y = "156pt", width = "840pt", height = "276pt" }
text = "body"
max_blocks = 1

[masters.figure.slots.caption]
binds = "flow"
accepts = ["paragraph"]
follows = "figure"
region = { x = "60pt", y = "440pt", width = "840pt", height = "40pt" }
text = "caption"
max_blocks = 1

[masters.quote.slots.quote]
binds = "flow"
accepts = ["quote"]
required = true
region = { x = "60pt", y = "120pt", width = "840pt", height = "240pt" }
text = "quote"
valign = "middle"
max_blocks = 1

[masters.quote.slots.attribution]
binds = "flow"
accepts = ["paragraph"]
follows = "quote"
region = { x = "60pt", y = "380pt", width = "840pt", height = "40pt" }
text = "caption"
max_blocks = 1

[masters.code.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.code.slots.code]
binds = "flow"
accepts = ["code"]
required = true
region = { x = "60pt", y = "156pt", width = "840pt", height = "324pt" }
text = "body"
max_blocks = 1
max_lines = 14

[masters.blank.slots.body]
binds = "flow"
accepts = ["paragraph", "list", "table", "image", "code", "quote"]
region = { x = "60pt", y = "40pt", width = "840pt", height = "440pt" }
text = "body"

[masters.hero.slots.backdrop]
binds = "flow"
accepts = ["image"]
required = true
layer = "back"
region = { x = "0pt", y = "0pt", width = "960pt", height = "540pt" }
text = "body"
max_blocks = 1
image = { fit = "cover", scrim = { color = "ink", opacity = 0.75, from = "bottom" } }

[masters.hero.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "300pt", width = "840pt", height = "120pt" }
text = "hero"
valign = "bottom"

[masters.hero.slots.lede]
binds = "flow"
accepts = ["paragraph"]
region = { x = "60pt", y = "432pt", width = "840pt", height = "60pt" }
text = "lede"
max_blocks = 1

[masters.image-left.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.image-left.slots.picture]
binds = "flow"
accepts = ["image"]
required = true
region = { x = "60pt", y = "156pt", width = "390pt", height = "324pt" }
text = "body"
max_blocks = 1
image = { fit = "cover" }

[masters.image-left.slots.body]
binds = "flow"
accepts = ["paragraph", "list"]
region = { x = "510pt", y = "156pt", width = "390pt", height = "324pt" }
text = "body"
max_items = 6
max_depth = 2

[masters.image-right.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.image-right.slots.body]
binds = "flow"
accepts = ["paragraph", "list"]
region = { x = "60pt", y = "156pt", width = "390pt", height = "324pt" }
text = "body"
max_items = 6
max_depth = 2

[masters.image-right.slots.picture]
binds = "flow"
accepts = ["image"]
required = true
region = { x = "510pt", y = "156pt", width = "390pt", height = "324pt" }
text = "body"
max_blocks = 1
image = { fit = "cover" }

[masters.image-full.slots.backdrop]
binds = "flow"
accepts = ["image"]
required = true
layer = "back"
region = { x = "0pt", y = "0pt", width = "960pt", height = "540pt" }
text = "body"
max_blocks = 1
image = { fit = "cover", scrim = { color = "ink", opacity = 0.6, from = "bottom" } }

[masters.image-full.slots.caption]
binds = "flow"
accepts = ["paragraph"]
region = { x = "60pt", y = "452pt", width = "840pt", height = "48pt" }
text = "lede"
max_blocks = 1

[masters.grid-2.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.grid-2.slots.left]
binds = "flow"
accepts = ["image"]
required = true
region = { x = "60pt", y = "156pt", width = "410pt", height = "324pt" }
text = "body"
max_blocks = 1
image = { fit = "cover" }

[masters.grid-2.slots.right]
binds = "flow"
accepts = ["image"]
required = true
follows = "left"
region = { x = "490pt", y = "156pt", width = "410pt", height = "324pt" }
text = "body"
max_blocks = 1
image = { fit = "cover" }

[masters.grid-3.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.grid-3.slots.first]
binds = "flow"
accepts = ["image"]
required = true
region = { x = "60pt", y = "156pt", width = "264pt", height = "324pt" }
text = "body"
max_blocks = 1
image = { fit = "cover" }

[masters.grid-3.slots.second]
binds = "flow"
accepts = ["image"]
required = true
follows = "first"
region = { x = "348pt", y = "156pt", width = "264pt", height = "324pt" }
text = "body"
max_blocks = 1
image = { fit = "cover" }

[masters.grid-3.slots.third]
binds = "flow"
accepts = ["image"]
required = true
follows = "second"
region = { x = "636pt", y = "156pt", width = "264pt", height = "324pt" }
text = "body"
max_blocks = 1
image = { fit = "cover" }

[masters.statement.slots.statement]
binds = "flow"
accepts = ["paragraph"]
required = true
region = { x = "60pt", y = "120pt", width = "840pt", height = "300pt" }
text = "statement"
valign = "middle"
align = "center"
max_blocks = 1
