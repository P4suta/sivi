[[masters.bullets.decor]]
kind = "page_number"
region = { x = "840pt", y = "496pt", width = "60pt", height = "24pt" }
text = "meta"
align = "right"
format = "{n}"

[masters.comparison.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.comparison.slots.left]
binds = "section"
section = 1
accepts = ["paragraph", "list", "table"]
region = { x = "60pt", y = "164pt", width = "405pt", height = "316pt" }
text = "body"
max_items = 5
max_depth = 2

[masters.comparison.slots.right]
binds = "section"
section = 2
accepts = ["paragraph", "list", "table"]
region = { x = "495pt", y = "164pt", width = "405pt", height = "316pt" }
text = "body"
