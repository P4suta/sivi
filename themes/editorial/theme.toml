# The editorial theme: Shippori Mincho and Playfair Display on warm paper, thin rules, and a vermilion marker.
schema = 1

[theme]
name = "editorial"

[page]
width = "960pt"
height = "540pt"
background = "paper"

[colors]
paper = "#f6f1e7"
ink = "#2a2420"
muted = "#6b625a"
accent = "#b5451b"
rule = "#d9cfbf"
code_bg = "#efe7d8"
highlight = "#f2c14e"

[typography]
min_size = "18pt"
paragraph_gap = "0.7em"
fallback = ["Shippori Mincho", "BIZ UDPGothic"]

[text.display]
font = ["Playfair Display", "Shippori Mincho"]
size = "56pt"
weight = 700
color = "ink"
line_height = 1.35
align = "left"

[text.title]
font = ["Playfair Display", "Shippori Mincho"]
size = "40pt"
weight = 700
color = "ink"
line_height = 1.35
align = "left"

[text.heading]
font = "Shippori Mincho"
size = "28pt"
weight = 700
color = "ink"
line_height = 1.5
align = "left"

[text.subtitle]
font = "Shippori Mincho"
size = "24pt"
weight = 400
color = "muted"
line_height = 1.6
align = "left"

[text.body]
font = "Shippori Mincho"
size = "24pt"
weight = 400
color = "ink"
line_height = 1.7
align = "left"

[text.quote]
font = ["Playfair Display", "Shippori Mincho"]
size = "32pt"
weight = 400
color = "ink"
line_height = 1.5
align = "left"

[text.caption]
font = "Shippori Mincho"
size = "18pt"
weight = 400
color = "muted"
line_height = 1.5
align = "center"

[text.table]
font = "Shippori Mincho"
size = "20pt"
weight = 400
color = "ink"
line_height = 1.5
align = "left"

[text.meta]
font = ["Playfair Display", "Shippori Mincho"]
size = "18pt"
weight = 400
color = "muted"
line_height = 1.4
align = "left"

[text.hero]
font = ["Playfair Display", "Shippori Mincho"]
size = "52pt"
weight = 700
color = "paper"
line_height = 1.35
align = "left"

[text.lede]
font = "Shippori Mincho"
size = "24pt"
weight = 400
color = "paper"
line_height = 1.6
align = "left"

[text.statement]
font = ["Playfair Display", "Shippori Mincho"]
size = "64pt"
weight = 700
color = "ink"
line_height = 1.35
align = "center"

[inline]
emphasis = { style = "color", color = "accent" }
strong = { weight = 700 }
code = { font = "JetBrains Mono", background = "code_bg" }
link = { color = "accent", underline = true }
mark = { marker = { color = "highlight", opacity = 0.55, top = "ascender", bottom = "descender" } }

[lists]
bullets = ["•", "–", "·"]
ordered = "1."
indent = "1.25em"
gap = "0.4em"

[code]
font = "JetBrains Mono"
size = "18pt"
line_height = 1.4
background = "code_bg"
padding = "14pt"
highlight = true
tab_width = 4
theme = "gruvbox-light-soft"

[tables]
text = "table"
header_weight = 700
rule = "rule"
padding = "7pt"

[quotes]
bar = "accent"
bar_width = "2pt"
indent = "28pt"

[masters.title.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "140pt", width = "840pt", height = "160pt" }
text = "display"
valign = "bottom"

[masters.title.slots.subtitle]
binds = "subtitle"
region = { x = "60pt", y = "312pt", width = "840pt", height = "64pt" }
text = "subtitle"
valign = "top"

[[masters.title.decor]]
kind = "rect"
region = { x = "60pt", y = "304pt", width = "120pt", height = "1pt" }
color = "accent"

[[masters.title.decor]]
kind = "field"
field = "author"
region = { x = "60pt", y = "440pt", width = "600pt", height = "28pt" }
text = "meta"
align = "left"

[[masters.title.decor]]
kind = "field"
field = "date"
region = { x = "660pt", y = "440pt", width = "240pt", height = "28pt" }
text = "meta"
align = "right"

[masters.section.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "200pt", width = "840pt", height = "120pt" }
text = "display"
valign = "middle"

[[masters.section.decor]]
kind = "rect"
region = { x = "60pt", y = "332pt", width = "120pt", height = "1pt" }
color = "accent"

[[masters.section.decor]]
kind = "page_number"
region = { x = "840pt", y = "496pt", width = "60pt", height = "24pt" }
text = "meta"
align = "right"
format = "{n}"

[masters.bullets.slots.title]
