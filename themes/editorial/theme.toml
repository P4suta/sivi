max_depth = 2

[[masters.comparison.decor]]
kind = "rect"
region = { x = "60pt", y = "152pt", width = "840pt", height = "1pt" }
color = "rule"

[[masters.comparison.decor]]
kind = "page_number"
region = { x = "840pt", y = "496pt", width = "60pt", height = "24pt" }
text = "meta"
align = "right"
format = "{n}"

[masters.figure.slots.title]
binds = "title"
required = true
region = { x = "60pt", y = "40pt", width = "840pt", height = "104pt" }
text = "title"
valign = "bottom"

[masters.figure.slots.figure]
binds = "flow"
accepts = ["image"]
