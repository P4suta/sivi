# Repeats the machine configuration of ocomment, which a hosted runner lacks.
version = 1

# Remove nothing.
[policy]
mode = "none"

# One sentence per line.
[style]
wrap = "sentence"

[files]
exclude = ["fuzz/corpus/**", "fonts/**", "fixtures/**/snapshots/**", "specs/traces/**"]

[[overrides]]
paths = ["justfile"]
language = "shell"
