# Repeats the machine configuration of ocomment, which a hosted runner lacks.
version = 1

# Remove nothing.
[policy]
mode = "none"

# One sentence per line.
[style]
wrap = "sentence"

# Deck fixtures are inputs under test, whose line breaks and trailing spaces the tests read.
[files]
exclude = [
  "fuzz/corpus/**",
  "fonts/**",
  "fixtures/decks/**",
  "fixtures/**/snapshots/**",
  "specs/traces/**",
]

[[overrides]]
paths = ["justfile"]
language = "shell"
