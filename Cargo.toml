[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
publish = false
authors = ["Yasunobu"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "deny", check-cfg = [
  'cfg(kani)',
  'cfg(verus_keep_ghost)',
  'cfg(verus_keep_ghost_body)',
  'cfg(verus_only)',
] }

unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
unit_bindings = "deny"
variant_size_differences = "deny"
ambiguous_negative_literals = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
mem_forget = "deny"
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
try_err = "deny"
unused_result_ok = "deny"
create_dir = "deny"
error_impl_error = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
string_add = "deny"
assertions_on_result_states = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
fallible_impl_from = "deny"
shadow_unrelated = "deny"
undocumented_unsafe_blocks = "deny"

multiple_crate_versions = "allow"

[workspace.dependencies]
sivi-core = { path = "crates/sivi-core" }
sivi-markdown = { path = "crates/sivi-markdown" }
sivi-theme = { path = "crates/sivi-theme" }
sivi-typst = { path = "crates/sivi-typst" }

annotate-snippets = "0.12"
anyhow = "1.0"
assert_cmd = "2"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
comrak = { version = "0.56", default-features = false }
insta = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2.0", default-features = false, features = [
  "full",
  "parsing",
  "visit",
  "printing",
  "clone-impls",
] }
tempfile = "3"
toml = { version = "1.0", features = ["preserve_order"] }
ttf-parser = "0.25"
typst-render = "=0.15.1"
ureq = "3"

[profile.test]
debug = 0

[profile.release]
strip = true
lto = true
codegen-units = 1
