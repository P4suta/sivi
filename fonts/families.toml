# The Google Fonts families the catalog carries, chosen for slides: every family that covers Japanese, and a curated range of Latin and other East Asian families.
# `cargo xtask fonts catalog` reads this list, fetches each family from google/fonts at the pinned commit, and writes `fonts/catalog.toml` with the digest of every file.
# A family lives under `ofl/`, `apache/`, or `ufl/` with its name lowercased and its spaces removed; `path` overrides that rule.

commit = "66928797f271fed5ee428544e7229685e2d90127"

